# Cloudflare Workers config for the LUMINA Impact frontend.
# Deployed via the OpenNext Cloudflare adapter (@opennextjs/cloudflare), which
# compiles the Next.js App Router build into a Worker + static assets.
#
# Local:   npm run cf:preview     (build + run in the workerd runtime)
# Deploy:  npm run cf:deploy       (build + publish)
# CI:      .github/workflows/deploy-cloudflare.yml

name = "lumina-impact"
main = ".open-next/worker.js"

# nodejs_compat requires a compatibility_date on/after 2024-09-23.
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (Next.js /public + build output) served from the edge.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Public env vars. NEXT_PUBLIC_* are inlined at BUILD time, so they must also
# be present in the build environment (Cloudflare dashboard build settings or
# the CI job) — not only here. Leave NEXT_PUBLIC_API_BASE empty to serve the
# built-in verified mock dataset with no backend.
# ---------------------------------------------------------------------------
[vars]
NEXT_PUBLIC_API_BASE = ""
NEXT_PUBLIC_DISPATCH_EMAIL = "hello@storitellah.com"

# Optional: use an R2 bucket as the incremental cache (recommended in prod).
# Create it with:  npx wrangler r2 bucket create lumina-impact-cache
# then wire it in open-next.config.ts.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "lumina-impact-cache"
